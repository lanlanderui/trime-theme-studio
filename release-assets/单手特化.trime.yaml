# Trime custom style settings
# encoding: utf-8
config_version: "3.0"
name: 单手特化         #方案名称
author: 锐        #作者信息

fallback_colors:
  border_color: back_color
  candidate_separator_color: back_color
  candidate_text_color: hilited_text_color
  comment_text_color: candidate_text_color
  enter_back_color: on_key_back_color
  enter_sym_back_color: off_sym_back_color
  enter_sym_text_color: on_key_text_color
  enter_symbol_color: enter_text_color
  enter_text_color: on_key_text_color
  hilited_back_color: back_color
  hilited_candidate_back_color: back_color
  hilited_candidate_text_color: text_color
  hilited_comment_text_color: hilited_candidate_text_color
  hilited_enter_back_color: hilited_on_key_back_color
  hilited_enter_sym_back_color: hilited_off_sym_back_color
  hilited_key_back_color: back_color
  hilited_key_symbol_color: key_symbol_color
  hilited_key_text_color: key_text_color
  hilited_main_back_color: back_color
  hilited_menu_back_color: key_back_color
  hilited_menu_text_color: enter_sym_back_color
  hilited_off_key_back_color: main_back_color
  hilited_off_key_text_color: off_key_text_color
  hilited_off_sym_back_color: key_back_color
  hilited_off_sym_text_color: hilited_off_key_text_color
  hilited_on_key_back_color: off_key_back_color
  hilited_on_key_text_color: on_key_text_color
  hilited_space_back_color: hilited_off_key_back_color
  hilited_text_color: text_color
  key_back_color: back_color
  key_border_color: back_color
  key_symbol_color: comment_text_color
  key_text_color: candidate_text_color
  keyboard_back_color: back_color
  label_color: hilited_text_color
  main_back_color: back_color
  menu_back_color: off_sym_back_color
  menu_text_color: off_sym_text_color
  off_key_back_color: hilited_main_back_color
  off_key_symbol_color: off_key_text_color
  off_key_text_color: key_text_color
  off_sym_back_color: hilited_key_back_color
  off_sym_fy_text_color: hilited_off_sym_back_color
  off_sym_text_color: off_key_text_color
  on_key_back_color: hilited_off_key_back_color
  on_key_text_color: hilited_key_text_color
  preview_back_color: back_color
  preview_text_color: key_text_color
  shadow_color: back_color
  space_back_color: off_key_back_color
  text_back_color: back_color
  bkg: on_key_back_color
  tkg: on_key_text_color
  benter: on_key_back_color
  tenter: on_key_text_color
  bgn: on_key_back_color
  tgn: on_key_text_color
  bbs: on_key_back_color
  tbs: on_key_text_color

style:
  auto_caps: false
  candidate_font: han.ttf
  candidate_padding: 5
  candidate_spacing: 0.0
  candidate_text_size: 18
  candidate_text_vertical_bias: 1.0
  candidate_view_height: 25
  comment_font: comment.ttf
  comment_height: 12
  comment_position: right
  comment_text_size: 10
  comment_vertical_bias: 0.0
  enter_label_mode: 0
  preview_font: latin.ttf
  preview_height: 60
  preview_offset: "-12"
  preview_text_size: 40
  enter_labels:
    default: Enter
    done: "完成"
    go: "前往"
    next: "下个"
    pre: "上个"
    search: "搜索"
    send: "发送"
  hanb_font: hanb.ttf
  horizontal_gap: 3
  key_font: symbol.ttf
  key_height: 50
  key_long_text_size: 16
  key_text_size: 20
  key_width: 10.0
  keyboard_height: 220
  keyboard_height_land: 200
  keyboard_padding_bottom: 38
  label_font: label.ttf
  label_text_size: 22
  latin_font: latin.ttf
  popup_bottom_margin: 68
  popup_font: latin.ttf
  popup_height: 48
  popup_key_height: 48
  popup_text_size: 23
  popup_width: 38
  reset_ascii_mode_on_focus_change: false
  round_corner: 5
  shadow_radius: 10
  symbol_font: symbol.ttf
  symbol_text_size: 10
  text_font: latin.ttf
  vertical_gap: 4
tool_bar:
  ascii_mode_button:
    action: Mode_switch
    foreground: {font_size: 18, option_styles: ["中", En], padding: 10}
  back_style: "ic@arrow-left"
  button_font: iconfont.ttf
  button_spacing: 5
  buttons:
    - {action: Hide, foreground: {fg_normal: candidate_text_color, style: "ic@keyboard_close"}}
    - {action: clipboard_window, foreground: {style: "ic@clipboard"}}
    - {action: Mode_switch, foreground: {font_size: 20, option_styles: ["中", "英"], padding: 10}}
  clipboard_button:
    action: clipboard_window
    foreground: {style: "ic@clipboard"}
  edit_button:
    action: Keyboard_editor
    foreground: {style: "ic@cursor_text"}
  emoji_button:
    action: liquid_keyboard_emoji
    foreground: {style: "ic@emoticon"}
  full_shape_button:
    action: Zenkaku_Hankaku
    foreground: {option_styles: ["ic@moon_full", "ic@moon_new"]}
  hide_button:
    action: Hide
    foreground: {normal: candidate_text_color, style: "ic@keyboard_close"}
  primary_button:
    action: menu_keyboard
    background: {corner_radius: 10, highlight: hilited_candidate_button_color, horizontal_inset: 4, normal: 0x00, type: circle, vertical_inset: 4}
    foreground: {normal: candidate_text_color, padding: 10, style: "ic@dots_horizontal"}
    long_press_action: Settings
preedit:
  foreground:
    font_size: 18	
  horizontal_padding: 8
  top_end_radius: 4
  top_start_radius: 4
  #alpha: 0.5

fallback_colors:
  candidate_text_color: text_color
    
    
#--------配色结束----------------#
window:
  foreground:
    comment_font_size: 16
    label_font_size: 20
    text_font_size: 20
  insets:
    horizontal: 4
    vertical: 4
  item_padding:
    horizontal: 4

liquid_keyboard:
  # 目前只能直接写参数，不支持变量或者fallback机制。
  # 缺少参数时，自动从style中加载参数。除非要指定liquid_keyboard使用与主键盘不同的背景色、背景图，否则不应设置被注释掉的参数。
  author: "tumuyan"
  row: 6              #每屏最多显示多少行按键
  row_land: 5         #横屏每屏最多显示多少行按键
  key_height: 30      #按键高度
  key_height_land: 40 #横屏模式按键 【【高度
  single_width: 43    #single类型的按键宽度
  vertical_gap: 2     #纵向按键间隙
  margin_x: 2       #左右按键间隙的1/2
  fixed_key_bar: # 固定按键条
    position: bottom  # 摆放位置（在滚动区域的……） top|bottom|left|right
    keys: # 按键（显示名称为对应的label，不能放太多）
      - liquid_keyboard_exit
      - space1
      - BackSpace
      - Return2
      - menu_keyboard
  keyboards: [encn, emoji]  #tab列表

  emoji:
    type: SINGLE
    name: ' 🤣 '
    keys: "😀😃😄😁😆😅🤣😂🙂🙃🫠😉"
  encn:
    type: SINGLE
    name: ' 🔣 '
    keys: ",.?!:;/\\|*-+=^$`'\"^~@#%&()[]{}_，。？！：、“”‘···……-（）【】《》［］｛｝「」『』～≈＝≠≌<>≤≥≡()[]{}-+±×*/÷&∥%‰‱°①②③④⑤⑥⑦⑧⑨⑩⒈⒉⒊⒋⒌⒍⒎⒏⒐⒑⒒⒓⒔⒕⒖⒗⒘⒙⒚⒛⑴⑵⑶⑷⑸⑹⑺⑻⑼⑽⑾⑿⒀⒁⒂⒃⒄⒅⒆⒇㈠㈡㈢㈣㈤㈥㈦㈧㈨㈩➊➋➌➍➎➏➐➑➒➓㊀㊁㊂㊃㊄㊅㊆㊇㊈㊉ⅰⅱⅲⅳⅴⅵⅶⅷⅸⅹⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ′″∫∮∯∬∭∰∞∑∧∏∈∵∴⊥∝∨∪•√〒∝∽∈∩∧⊙⌒∥∟∣∂∆∞≌∉∪∨⊕⊿⊥∠∫∬∭℃¥$€฿￡㎡m³℉￥£￠₠¹²³⁴⁵ⁿ⁶⁷⁸⁹⁰ˣ⁺⁻⁼⁽⁾½⅓¼⅔¾₁₂₃₄₅ₙ₆₇₈₉₀ₓ₊₋₌₍₎℅△▽○◇□☆▲▼●◆■★▷◁▶◀♻♲†⚝✡⚹✦✸✹￼�×⌫☑☒✅❎✔✘✓✗☀☼☽☾◑◐㏂㏘☭♀♂☹☻☠☜☝☞☚☟☛▪•‥…∷※♩♪♫♬§°♭♯♮‖¶№◎¤۞℗®©卍卐℡™㏇Φ⇦⇧⇨⇩⇪↖↑↗←↔→↙↓↘⇄⇅⇆⇤↩⇥▸◂▴▾◤◥◣◢㊤㊧㊥㊨㊦❏❐◲〼▢▣↶✁↷✍⏍ϟ📝✎✆☱☰☴⚿⛮⚙☲☯☵⛶☩☐☳☷☶💬🗨⟲ღ✈☂🎤🌐🔍"
preset_keyboards:
  default:
    author: "锐"
    name: 26键默认布局
    lock: true
    width: 10
    ascii_mode: 0
    key_hint_offset_x: 0
    key_hint_offset_y: 0
    key_press_offset_x: 2
    key_press_offset_y: 2
    key_symbol_offset_x: 10
    key_symbol_offset_y: 0
    key_text_offset_x: 0
    key_text_offset_y: 0
    keys:
      # 第一排 按键
      - {click: o,popup: [Date,Time] ,height: 30}
      - {click: p}
      - {click: l}
      - {click: '/', width: 13, key_back_color: bgn, key_text_color: tgn}
      - {click: Return3, composing: space1,  width: 13, key_back_color: benter, key_text_color: tenter}
      - {click: BackSpace, width: 13, key_back_color: bbs, key_text_color: tbs}
      - {click: q}
      - {click: w}
      - {click: e}
      # 第二排 按键
      - {click: q, long_click: 1, swipe_up: Page_Up}
      - {click: w, long_click: 2, swipe_up: Page_Down}
      - {click: e, long_click: 3, swipe_up: 3}
      - {click: r, long_click: 4}
      - {click: t, long_click: 5}
      - {click: y, long_click: 6}
      - {click: u, long_click: 7}
      - {click: i, long_click: 8}
      - {click: o, long_click: 9}
      - {click: p, long_click: 0}
      # 第三排 按键
      - {width: 5}
      - {click: a, long_click: select_all, popup: [select_all,"@"]}
      - {click: s, long_click: "#"}
      - {click: d, long_click: "-"}
      - {click: f, long_click: '&'}
      - {click: g, long_click: '%'}
      - {click: h, long_click: "+"}
      - {click: j, long_click: "'", popup: ['(','[','{','【','《','<','≤',"'"]}
      - {click: k, long_click: '"', popup: [')',']','}','】','》','>','≥','"']}
      - {click: l}
      - {width: 5}
      # 第四排 按键
      - {click: Shift_L, popup: ['/', Shift_L], composing: '`', width: 15, key_back_color: bgn, key_text_color: tgn}
      - {click: z, long_click: undo}
      - {click: x, long_click: cut}
      - {click: c, long_click: copy}
      - {click: v, long_click: paste}
      - {click: b, long_click: ':' }
      - {click: n, long_click: '!' }
      - {click: m, long_click: '?' }
      - {click: BackSpace1, width: 15, key_back_color: bbs, key_text_color: tbs}
      # 第五排 按键
      - {click: Keyboard_numbers, composing: Return, popup: [Theme_settings,SaveDynamicColor,DynamicColor,Color_switch,liquid_keyboard_encn,zcci], width: 15, key_back_color: bgn, key_text_color: tgn} #
      - {click: ',', popup: [Left, Right], width: 10, key_back_color: bgn, key_text_color: tgn}
      - {click: Keyboard_number, key_back_color: bgn, key_text_color: tgn}
      - {click: space, width: 33, key_back_color: bkg, key_text_color: tkg}
      - {click: '.', label: ' 。' , width: 12, key_back_color: bgn, key_text_color: tgn}
      - {click: Return, width: 20, key_back_color: benter, key_text_color: tenter}

  numbers:
    author: "锐"
    name: 26键符号
    lock: true
    width: 10
    ascii_mode: 1
    keys:
      # 第一排 按键
      - {click: 1}
      - {click: 2}
      - {click: 3}
      - {click: 4}
      - {click: 5}
      - {click: 6}
      - {click: 7}
      - {click: 8}
      - {click: 9}
      - {click: 0}
      # 第二排 按键
      - {click: '@'}
      - {click: '#'}
      - {click: '$'}
      - {click: '_', long_click: '~'}
      - {click: '&'}
      - {click: '-'}
      - {click: '+'}
      - {click: '('}
      - {click: ')'}
      - {click: '/'}
      # 第三排 按键
      - {click: '~'}
      - {click: '{'}
      - {click: '}'}
      - {click: '['}
      - {click: Return3, key_back_color: benter, key_text_color: tenter}
      - {click: BackSpace, key_back_color: bbs, key_text_color: tbs}
      - {click: ']'}
      - {click: '【'}
      - {click: '】'}
      - {click: 6}
      # 第四排 按键
      - {click: Keyboard_number,width: 15, key_back_color: bgn, key_text_color: tgn}
      - {click: '*'}
      - {click: '"'}
      - {click: "'"}
      - {click: ':'}
      - {click: ';'}
      - {click: '!'}
      - {click: '?'}
      - {click: BackSpace1, width: 15, key_back_color: bbs, key_text_color: tbs}
      # 第五排 按键
      - {click: Keyboard_default, long_click: Theme_settings,width: 20, key_back_color: bgn, key_text_color: tgn}
      - {click: ',',width: 12, key_back_color: bgn, key_text_color: tgn}
      - {click: space, width: 36, key_back_color: bkg, key_text_color: tkg}
      - {click: '.',width: 12, key_back_color: bgn, key_text_color: tgn}
      - {click: Return, width: 20, key_back_color: benter, key_text_color: tenter}

  number:
    author: "暖暖"
    name: 数字+
    width: 12
    ascii_mode: 0
    lock: true
    keys:
      - {click: '!'}
      - {click: '+'}
      - {click: 1,width: 21}
      - {click: 2,width: 21}
      - {click: 3,width: 21}
      - {click: space1, key_back_color: bkg, key_text_color: tk}

      - {click: '!'}
      - {click: '-'}
      - {click: 4,width: 21}
      - {click: 5,width: 21}
      - {click: 6,width: 21}
      - {label: EN, click: Keyboard_defaulten, key_back_color: bgn, key_text_color: tgn}

      - {click: '(){Left}'}
      - {click: '*'}
      - {click: 7,width: 21}
      - {click: 8, width: 21}
      - {click: 9,width: 21}
      - {click: BackSpace, key_back_color: bbs, key_text_color: tbs}

      - {click: Keyboard_default, key_back_color: bgn, key_text_color: tgn}
      - {click: Keyboard_number_lh, key_back_color: bgn, key_text_color: tgn}
      - {click: ., width: 21}
      - {click: 0, width: 21}
      - {click: '=',width: 21}
      - {click: Return, key_back_color: benter, key_text_color: tenter}



preset_keys:
  # 编辑📇

  Shift_L: {label: Shift, preview: '⇪', functional: true, send: Shift_L}
  Return: { label: enter_labels, preview: '↩', functional: true, send: Return }
  Returnk: { label: Enter, preview: '↩', functional: true, send: Return }
  Return1: {label: Enter, preview: '↩', functional: true, send: Return}
  Return2: {label: 回车, functional: true, send: Return }
  Return3: {label: ✦, functional: true, send: Return }
  Hide: {label: 隐藏, functional: true, send: BACK} 
  BackSpace: {label: ⊗, preview: '⇦', repeatable: true, functional: true, send: BackSpace}
  BackSpace1: {label: ⌫, preview: '⇦', repeatable: true, functional: true, send: BackSpace}
  space: {repeatable: false, preview: ' ', functional: true, label: '_______', send: space}
  space2: {repeatable: false, preview: ' ', functional: true, label: 'Ω', send: space}
  space1: {repeatable: false, label: '上屏', functional: true, send: space}
  Escape: {label: 取消, functional: false, send: Escape}
  Home: {label: 行首, send: Home, functional: false}
  Insert: {label: 插入, send: Insert}
  Delete: {label: 删除, send: Delete, functional: false}
  End: {label: 行尾, send: End, functional: false}
  Page_Up: {label: ↑, send: Page_Up, functional: false}
  Page_Down: {label: ↓, send: Page_Down, functional: false}
  Left: {label: '←', send: Left, repeatable: true, functional: false}
  Down: {label: '↓', send: Down, functional: false}
  Up: {label: '↑', send: Up, functional: false}
  Right: {label: '→', send: Right, repeatable: true, functional: false}
  select_all: {label: all, functional: false, send: Control+a}
  cut: {label: cut, functional: false, send: Control+x}
  copy: {label: copy, functional: false, send: Control+c}
  paste: {label: paste, functional: false, send: Control+v}
  paste_text: {label: 貼上文本, send: Control+Shift+Alt+v} #>=Android 6.0
  share_text: {label: 分享文本, send: Control+Alt+s} #>=Android 6.0
  redo: {label: 重做, functional: false, send: Control+Shift+z} #>=Android 6.0
  undo: {label: undo, functional: false, send: Control+z} #>=Android 6.0
  delimiter: {label: 分词, text: ''''}
  zcci: {label: 造, text: '`'}

  # rime组合键
  Keyboard_lh: { label: '◂', send: Eisu_toggle, select: lh }
  Keyboard_rh: { label: '▸', send: Eisu_toggle, select: rh }
 
  F4: {label: 方案菜单, send: F4}
  BackToPreviousSyllable: {label: 删音节, send: Control+BackSpace}
  
  CommitRawInput: {label: 编码, send: Control+Return}
  CommitScriptText: {label: 编码, send: Shift+Return}
  CommitComment: {label: 编码, send: Control+Shift+Return}
  DeleteCandidate: {label: 删词, send: Control+Delete, functional: false}
  #切换键盘
  Keyboard_letter: { label: 字母, functional: true, send: Eisu_toggle, select: default }
  Keyboard_number_lh: { label: 123, functional: true, send: Eisu_toggle, select: number_lh }
  Keyboard_number_rh: { label: 123, functional: true, send: Eisu_toggle, select: number_rh }
  Keyboard_default: { label: 返回, functional: true, send: Eisu_toggle, select: .default }
  Keyboard_default_1: { label: ✦, functional: true, send: Eisu_toggle, select: default_1 }
  Keyboard_switch: { label: 键盘, functional: true, send: Eisu_toggle, select: .next }
  Keyboard_number: { label: 123, functional: true, send: Eisu_toggle, select: number }
  Keyboard_numbers: { label: ❖, functional: true, send: Eisu_toggle, select: numbers }
  Keyboard_numberb: { label: 123, functional: true, send: Eisu_toggle, select: numberb }
  Keyboard_symbols: { label: 更多, functional: true, send: Eisu_toggle, select: symbols }
  Keyboard_move: { label: ❖, functional: true, send: Eisu_toggle, select: move }
  Keyboard_next: { label: 后退, functional: true, send: Eisu_toggle, select: .next }
  Keyboard_last: { label: 后退, functional: true, send: Eisu_toggle, select: .last }
  Keyboard_last_lock: { label: 返回, functional: true, send: Eisu_toggle, select: .last_lock } #直接切換到下一键盘
  liquid_keyboard_exit: {label: 返回, functional: true,  command: liquid_keyboard, option: "-1"}  #退出liquidkeyboard
  liquid_keyboard_switch: { label: 更多,  command: liquid_keyboard, option: "特殊" }
  liquid_keyboard_switch2: { toggle: _liquid_keyboard,  states: [ 更多, 更多 ] }
  liquid_keyboard_tabs: { label: 更多,  command: liquid_keyboard, option: "更多" }
  liquid_keyboard_emoji: { label: 🙂,  command: liquid_keyboard, option: " 🤣 " }
  liquid_keyboard_clipboard: { label: 剪贴,  command: liquid_keyboard, option: " 📋 " }
  liquid_keyboard_encn: { label: 🔣,  command: liquid_keyboard, option: " 🔣 " }
  menu_keyboard: { label: 菜单, functional: true,  command: menu_keyboard }
  # rime状态
  Mode_switch: {toggle: ascii_mode, functional: false, send: SWITCH_CHARSET, states: [ 中文, 西文 ]}
  Zenkaku_Hankaku: {toggle: full_shape,  states: [ 半角, 全角 ]}
  Henkan: {toggle: simplification,  states: [ 汉字, 汉字 ]}
  Charset_switch: {toggle: extended_charset,  states: [ 常用, 增广 ]}
  Punct_switch: {toggle: ascii_punct,  states: [ 。，, ．， ]}
  # trime设置
  IME_switch: {label: 🌐, send: LANGUAGE_SWITCH} #彈出對話框選擇輸入法
  IME_last: {label: 上一输入法, send: LANGUAGE_SWITCH, select: .last} #直接切換到上一輸入法
  IME_next: {label: 下一输入法, send: LANGUAGE_SWITCH, select: .next} #直接切換到下一輸入法
  Schema_switch: {label: 下一方案, functional: false, send: Control+Shift+1}
