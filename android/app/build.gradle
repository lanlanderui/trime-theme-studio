apply plugin: "com.android.application"

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")

android {
    namespace "com.lanlanderui.trimedynamiccolors"
    // Dynamic colors are resolved by resource name at runtime, so the app stays
    // source-compatible with a compact SDK while still reading Android 12+ colors.
    compileSdkVersion 28

    defaultConfig {
        applicationId "com.lanlanderui.trimedynamiccolors"
        minSdk 23
        targetSdk 35
        versionCode 8
        versionName "1.6.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            if (releaseKeystorePath) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
