plugins {
    id "com.android.application"
}

android {
    namespace "com.lanlanderui.trimethemestudio"
    compileSdk 35

    defaultConfig {
        applicationId "com.lanlanderui.trimethemestudio"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register("copyWebAssets", Copy) {
    from(rootProject.projectDir.parentFile) {
        include "index.html"
        include "styles.css"
        include "app.js"
        include "bundled-config.js"
        include "trime.yaml"
        include "tongwenfeng.trime.yaml"
    }
    into(layout.projectDirectory.dir("src/main/assets/www"))
}

preBuild.dependsOn(copyWebAssets)
