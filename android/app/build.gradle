apply plugin: "com.android.application"

android {
    namespace "com.lanlanderui.trimedynamiccolors"
    // Dynamic colors are resolved by resource name at runtime, so the app stays
    // source-compatible with a compact SDK while still reading Android 12+ colors.
    compileSdkVersion 28

    defaultConfig {
        applicationId "com.lanlanderui.trimedynamiccolors"
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName "1.5.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}
