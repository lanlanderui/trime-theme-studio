# --------------------------------------------------------------- 配色 ----
# 一个用到全部颜色参数的配色。值必须是颜色本身（0xAARRGGBB / #RRGGBB），
# 不能写别的颜色键名——那是 fallback_colors 的写法，写在这里会被判为无法解析。
preset_color_schemes:
  default:
    name: 模版配色
    author: 你的名字
    back_color: 0xFFEEEEEE   # 键盘与候选栏的底色
    border_color: 0xFFCCCCCC   # 通用边框色
    shadow_color: 0x22000000   # 阴影色
    root_background: 0xFFEEEEEE   # 整个键盘区 + 候选栏的背景（也可写背景图文件名）
    keyboard_back_color: 0xffDDDDDD   # 键盘区背景
    keyboard_background: 0xffDDDDDD   # 键盘背景色（也可写背景图文件名）
    liquid_keyboard_background: 0xFFDDDDDD   # liquidKeyboard 背景色（也可写图片文件名）
    candidate_background: 0xFFEEEEEE   # 候选栏整体背景
    candidate_border_color: 0xFFCCCCCC   # 候选栏边框
    candidate_separator_color: 0xFFB0B0B0   # 候选分割线
    candidate_text_color: 0xFF333333   # 候选文字
    comment_text_color: 0xFF808080   # 候选注释文字
    hilited_text_color: 0xFF333333   # 高亮编码文字
    hilited_back_color: 0xFFDDDDDD   # 高亮编码背景
    hilited_candidate_back_color: 0xFF9BC7E8   # 高亮候选背景
    hilited_candidate_text_color: 0xFF1A1A1A   # 高亮候选文字
    hilited_candidate_button_color: 0xFF9BC7E8   # 高亮候选按钮底色
    hilited_label_color: 0xFF1A1A1A   # 高亮候选序号
    hilited_comment_text_color: 0xFF606060   # 高亮候选注释
    text_color: 0xFF333333   # 编码文字
    text_back_color: 0xFFEEEEEE   # 编码区背景（悬浮窗背景）
    key_back_color: 0xFFEEEEEE   # 按键底色
    key_text_color: 0xFF222222   # 按键文字
    key_symbol_color: 0xFF808080   # 按键符号
    key_border_color: 0x1F000000   # 按键边框
    label_color: 0xFF808080   # 键盘标签
    off_key_back_color: 0xFFEEEEEE   # 无功能键底色
    off_key_text_color: 0xFF222222   # 无功能键文字
    off_key_symbol_color: 0xFF808080   # 无功能键符号
    off_key_border_color: 0x1F000000   # 无功能键边框
    on_key_back_color: 0xFFEEEEEE   # 有功能键底色
    on_key_text_color: 0xFF222222   # 有功能键文字
    on_key_symbol_color: 0xFF808080   # 有功能键符号
    on_key_border_color: 0x1F000000   # 有功能键边框
    hilited_key_back_color: 0xFF9BC7E8   # 按下键底色
    hilited_key_text_color: 0xFF1A1A1A   # 按下键文字
    hilited_key_symbol_color: 0xFF606060   # 按下键符号
